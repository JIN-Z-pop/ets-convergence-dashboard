<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETS System Comparison</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script src="shared.js?v=12"></script>
</head>
<body>
<script>initPage('compare');</script>

<div class="page-header">
  <h1 data-i18n="pageCompareTitle"></h1>
  <p data-i18n="pageCompareSub"></p>
</div>

<div class="chart-wrap"><div class="chart-box" id="radar-chart"></div>
<p id="radar-note" hidden style="text-align:center;color:var(--muted);font-size:0.85em;margin-top:8px;"></p></div>

<div class="chart-wrap">
  <div class="chart-box" style="padding:20px;overflow-x:auto;">
    <h3 id="detail-title" style="color:#63b3ed;margin-bottom:12px;"></h3>
    <table id="compare-table"></table>
  </div>
</div>

<style>
#compare-table { width:100%; border-collapse:collapse; font-size:0.85em; }
#compare-table th { background:#1e2d3d; color:#63b3ed; padding:10px 14px; text-align:left; border-bottom:2px solid #2d3748; cursor:pointer; white-space:nowrap; }
#compare-table th:hover { background:#2d3748; }
#compare-table td { padding:8px 14px; border-bottom:1px solid #2d3748; color:#e0e0e0; }
#compare-table tr:hover td { background:#1e2d3d; }
.country-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.82em; font-weight:600; color:#fff; }
</style>

<script>
// === RADAR AXES (multilingual) ===
const RADAR_AXES = {
  en: ['Price Level', 'Coverage %', 'Auction %', 'Penalty Severity', 'System Age'],
  ja: ['\u4FA1\u683C\u6C34\u6E96', '\u30AB\u30D0\u30FC\u7387 %', '\u30AA\u30FC\u30AF\u30B7\u30E7\u30F3\u7387 %', '\u7F70\u5247\u306E\u53B3\u3057\u3055', '\u5236\u5EA6\u5E74\u9F62'],
  ko: ['\uAC00\uACA9 \uC218\uC900', '\uCEE4\uBC84\uC728 %', '\uACBD\uB9E4\uC728 %', '\uBC8C\uCE59 \uAC15\uB3C4', '\uC81C\uB3C4 \uC5F0\uB839'],
  zh: ['\u4EF7\u683C\u6C34\u5E73', '\u8986\u76D6\u7387 %', '\u62CD\u5356\u7387 %', '\u5904\u7F5A\u4E25\u5389\u5EA6', '\u5236\u5EA6\u5E74\u9F84']
};

let RADAR_VALUES = null;
let RADAR_PRICE_MISSING = false;
let TABLE_VALUES = null;

// === TABLE METRIC LABELS (multilingual) ===
const METRIC_LABELS = {
  en: ['System Name','Start Year','Current Price','Coverage','Covered Entities','Cap Type','Auction Rate','Allocation Method','Offset Allowed','Penalty','Banking','Borrowing','MRV System','2030 Target'],
  ja: ['\u5236\u5EA6\u540D','\u958B\u59CB\u5E74','\u73FE\u5728\u4FA1\u683C','\u30AB\u30D0\u30FC\u7387','\u5BFE\u8C61\u4F01\u696D\u6570','\u30AD\u30E3\u30C3\u30D7\u7A2E\u985E','\u30AA\u30FC\u30AF\u30B7\u30E7\u30F3\u7387','\u5272\u5F53\u65B9\u5F0F','\u30AA\u30D5\u30BB\u30C3\u30C8','\u7F70\u5247','\u7E70\u8D8A','\u501F\u5165','MRV\u30B7\u30B9\u30C6\u30E0','2030\u5E74\u76EE\u6A19'],
  ko: ['\uC81C\uB3C4\uBA85','\uC2DC\uC791 \uC5F0\uB3C4','\uD604\uC7AC \uAC00\uACA9','\uCEE4\uBC84\uC728','\uB300\uC0C1 \uAE30\uC5C5 \uC218','\uC0C1\uD55C \uC720\uD615','\uACBD\uB9E4\uC728','\uD560\uB2F9 \uBC29\uC2DD','\uC624\uD504\uC14B','\uBC8C\uCE59','\uC774\uC6D4','\uCC28\uC785','MRV \uC2DC\uC2A4\uD15C','2030\uB144 \uBAA9\uD45C'],
  zh: ['\u5236\u5EA6\u540D','\u8D77\u59CB\u5E74','\u5F53\u524D\u4EF7\u683C','\u8986\u76D6\u7387','\u7EB3\u5165\u4F01\u4E1A\u6570','\u4E0A\u9650\u7C7B\u578B','\u62CD\u5356\u7387','\u5206\u914D\u65B9\u5F0F','\u62B5\u6D88','\u5904\u7F5A','\u7ED3\u8F6C','\u501F\u5165','MRV\u7CFB\u7EDF','2030\u5E74\u76EE\u6807']
};

function renderRadar() {
  if (!RADAR_VALUES) return;
  const lang = getLang();
  const axes = RADAR_AXES[lang] || RADAR_AXES.en;
  const countries = ['EU', 'Korea', 'China', 'Japan'];
  const traces = countries.map(c => ({
    type: 'scatterpolar',
    r: [...RADAR_VALUES[c], RADAR_VALUES[c][0]],
    theta: [...axes, axes[0]],
    fill: 'toself',
    fillcolor: THEME.countries[c] + '18',
    name: countryName(c),
    line: { color: THEME.countries[c], width: 2 },
    marker: { size: 5 }
  }));

  const layout = darkLayout(t('chartRadar'), {
    polar: {
      bgcolor: THEME.card,
      radialaxis: { visible: true, range: [0, 105], gridcolor: THEME.border, tickfont: { color: THEME.dimmed, size: 10 } },
      angularaxis: { gridcolor: THEME.border, tickfont: { color: THEME.muted, size: 11 } }
    },
    legend: { orientation: 'h', y: -0.08, font: { color: THEME.muted } },
    margin: { l: 60, r: 60, t: 50, b: 60 }
  });

  Plotly.newPlot('radar-chart', traces, layout, plotlyConfig);
  const note = document.getElementById('radar-note');
  note.textContent = RADAR_PRICE_MISSING ? t('radarNoPrice') : '';
  note.hidden = !RADAR_PRICE_MISSING;
}

// 比較表の「Current Price」の行(METRIC_LABELS の 3 番目)は EU・Korea・China を data/prices.json の当年行から出す。
// 取れない時は「\u2014」(古い固定値は出さない)。Japan は systems.json の固定の文言のまま。
const PRICE_ROW = 2;
const PRICE_KEYS = { EU: 'eu_eur', Korea: 'korea_krw', China: 'china_cny' };
let PRICES = null;
// Value dictionary for the compare table (sheet v0.2 §B): key = the English
// value stored in data/systems.json. Flat on purpose: a repeated literal such as
// Yes/No/TBD has one meaning, so one translation.
const VALUE_I18N = {
  'Absolute': { ja: '絶対量', ko: '절대량', zh: '绝对量' },
  'Intensity-based': { ja: '強度基準', ko: '강도 기반', zh: '强度基准' },
  'Voluntary targets': { ja: '自主目標', ko: '자발적 목표', zh: '自愿目标' },
  '~40% of GHG': { ja: 'GHG の約40%', ko: 'GHG의 약 40%', zh: 'GHG的约40%' },
  '~68% of GHG': { ja: 'GHG の約68%', ko: 'GHG의 약 68%', zh: 'GHG的约68%' },
  '~60% (power only)': { ja: '約60%（発電のみ）', ko: '약 60%(발전만)', zh: '约60%（仅电力）' },
  'N/A (GX League)': { ja: '該当なし（GXリーグ）', ko: '해당 없음(GX 리그)', zh: '不适用（GX联盟）' },
  '~747 (GX League)': { ja: '約747（GXリーグ）', ko: '약 747(GX 리그)', zh: '约747（GX联盟）' },
  '0% (100% free)': { ja: '0%（100%無償）', ko: '0%(100% 무상)', zh: '0%（100%免费）' },
  '0% (2033~ planned)': { ja: '0%（2033年〜予定）', ko: '0%(2033년~ 예정)', zh: '0%（2033年起计划）' },
  'BM + Auction': { ja: 'BM＋オークション', ko: 'BM+경매', zh: '基准法+拍卖' },
  'GF + BM + Auction': { ja: 'GF＋BM＋オークション', ko: 'GF+BM+경매', zh: '历史法+基准法+拍卖' },
  'Intensity BM': { ja: '強度BM', ko: '강도 BM', zh: '强度基准法' },
  'Self-set targets': { ja: '自主設定目標', ko: '자체 설정 목표', zh: '自主设定目标' },
  'No (Phase 4)': { ja: 'なし（フェーズ4）', ko: '없음(4단계)', zh: '无（第四阶段）' },
  'Yes (KOC, 10%)': { ja: 'あり（KOC、10%）', ko: '있음(KOC, 10%)', zh: '有（KOC，10%）' },
  'Yes (CCER, 5%)': { ja: 'あり（CCER、5%）', ko: '있음(CCER, 5%)', zh: '有（CCER，5%）' },
  '€100/t + next year': { ja: '€100/t＋翌年義務', ko: '€100/t+차년도 의무', zh: '€100/t+次年补缴' },
  '3x market price': { ja: '市場価格の3倍', ko: '시장가격의 3배', zh: '市场价格的3倍' },
  '1-5x avg price': { ja: '平均価格の1〜5倍', ko: '평균가격의 1~5배', zh: '平均价格的1~5倍' },
  'Name & shame (TBD)': { ja: '公表による制裁（未定）', ko: '공표 방식(미정)', zh: '公开通报（待定）' },
  'Yes': { ja: 'あり', ko: '있음', zh: '有' },
  'No': { ja: 'なし', ko: '없음', zh: '无' },
  'TBD': { ja: '未定', ko: '미정', zh: '待定' },
  'Limited': { ja: '限定的', ko: '제한적', zh: '有限' },
  'CEMS + Calc.': { ja: 'CEMS＋算定', ko: 'CEMS+산정', zh: 'CEMS+核算' },
  '-62% (vs 2005)': { ja: '-62%（2005年比）', ko: '-62%(2005년 대비)', zh: '-62%（较2005年）' },
  '-40% (vs 2018)': { ja: '-40%（2018年比）', ko: '-40%(2018년 대비)', zh: '-40%（较2018年）' },
  '-65% intensity (vs 2005)': { ja: '強度 -65%（2005年比）', ko: '강도 -65%(2005년 대비)', zh: '强度-65%（较2005年）' },
  '-46% (vs 2013)': { ja: '-46%（2013年比）', ko: '-46%(2013년 대비)', zh: '-46%（较2013年）' },
  'GHG Protocol': { ja: 'GHGプロトコル', ko: 'GHG 프로토콜', zh: 'GHG核算体系' }
};
function valueText(v) {
  const d = VALUE_I18N[v];
  return (getLang() !== 'en' && d && d[getLang()]) || v;
}

function priceCell(country, fixed) {
  const key = PRICE_KEYS[country];
  if (!key) return fixed;
  const f = formatYearlyPrice(PRICES, key);
  return f ? f.table : '\u2014';
}

function renderTable() {
  if (!TABLE_VALUES) return;
  const lang = getLang();
  const metrics = METRIC_LABELS[lang] || METRIC_LABELS.en;
  const countries = ['EU', 'Korea', 'China', 'Japan'];
  const colors = countries.map(c => THEME.countries[c]);

  document.getElementById('detail-title').textContent = t('detailCompare');

  let html = '<thead><tr><th onclick="sortTable(0)">' + t('metric') + ' \u25B2\u25BC</th>';
  countries.forEach((c, i) => {
    html += `<th onclick="sortTable(${i+1})"><span class="country-badge" style="background:${colors[i]}">${COUNTRY_FLAGS[c]} ${countryName(c)}</span> \u25B2\u25BC</th>`;
  });
  html += '</tr></thead><tbody>';

  metrics.forEach((label, idx) => {
    const row = TABLE_VALUES[idx];
    html += `<tr><td style="font-weight:600;color:${THEME.accent}">${label}</td>`;
    countries.forEach(c => { html += `<td>${valueText(idx === PRICE_ROW ? priceCell(c, row[c]) : row[c])}</td>`; });
    html += '</tr>';
  });
  html += '</tbody>';
  document.getElementById('compare-table').innerHTML = html;
}

let sortCol = -1, sortAsc = true;
function sortTable(col) {
  const table = document.getElementById('compare-table');
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
  rows.sort((a, b) => {
    const va = a.children[col].textContent;
    const vb = b.children[col].textContent;
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  rows.forEach(r => tbody.appendChild(r));
}

// Load data then render
Promise.all([fetch('data/systems.json').then(r => r.json()), loadPrices()])
  .then(([data, prices]) => {
    PRICES = prices;
    RADAR_VALUES = data.radar;
    // 価格水準(第 1 軸)の韓国・中国は systems.json に値を持たない(null)。当年平均の USD から EU=100 で作る。
    // 取れない時は上書きしない=null のまま渡す(その頂点は描かれない・0 とは読ませない)＋注記を出す。
    const rp = buildRadarPrice(prices);
    RADAR_PRICE_MISSING = !rp;
    if (rp) { RADAR_VALUES.Korea[0] = rp.Korea; RADAR_VALUES.China[0] = rp.China; }
    TABLE_VALUES = data.table;
    renderRadar();
    renderTable();
  })
  .catch(err => console.error('Failed to load systems data:', err));

window.addEventListener('langchange', () => { renderRadar(); renderTable(); });
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
</script>
</body>
</html>
